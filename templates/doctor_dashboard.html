<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f2f6fa;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #03045E;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .main {
            flex: 1;
            padding: 40px;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>MediCare</h2>
    <p>Doctor Panel</p>
</div>

<div class="main">
    <h1>Doctor Dashboard</h1>

    <table>
        <tr>
            <th>Date</th>
            <th>Patient</th>
            <th>Status</th>
        </tr>
        {% for a in appointments %}
        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
