<!DOCTYPE html>
<html>
<head>
    <title>Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;" class="p-5">

<div class="container">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4>Payment Successful</h4>
        </div>

        <div class="card-body">

            <p><strong>Invoice ID:</strong> {{ bill_id }}</p>
            <p><strong>Date:</strong> {{ bill[1] }}</p>

            <table class="table table-bordered mt-4">
                <thead class="table-dark">
                    <tr>
                        <th>Medicine</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    {% for name, qty, price in items %}
                    <tr>
                        <td>{{ name }}</td>
                        <td>{{ qty }}</td>
                        <td>₹ {{ price }}</td>
                        <td>₹ {{ qty * price }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <h5 class="text-end">
                Grand Total: ₹ {{ bill[0] }}
            </h5>

            <div class="mt-4">
                <a href="/order_medicines" class="btn btn-primary">
                    Order More Medicines
                </a>
                <a href="/patient" class="btn btn-secondary ms-2">
                    Back to Dashboard
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
