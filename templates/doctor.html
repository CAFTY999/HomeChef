<!DOCTYPE html>
<html>
<head>
<title>Doctor Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#1e293b;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.menu{
    margin:10px 0;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
}

.menu:hover{
    background:#334155;
}

/* MAIN */
.main{
    flex:1;
    background:#f1f5f9;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

button{
    padding:8px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.approve{background:#22c55e;color:white;}
.reject{background:#ef4444;color:white;}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Doctor</h2>
    <div class="menu" onclick="loadPending()">Requests</div>
    <div class="menu" onclick="loadApproved()">Upcoming</div>
</div>

<!-- MAIN -->
<div class="main">
    <h2 id="title">Requests</h2>
    <div id="list"></div>
</div>

<script>
const doctor_id = localStorage.getItem("user_id");

// LOAD PENDING
async function loadPending(){
    document.getElementById("title").innerText="Pending Requests";

    let res=await fetch("/doctor_appts/"+doctor_id);
    let data=await res.json();

    let filtered=data.filter(x=>x[4]=="pending");

    render(filtered);
}

// LOAD APPROVED
async function loadApproved(){
    document.getElementById("title").innerText="Upcoming Appointments";

    let res=await fetch("/doctor_appts/"+doctor_id);
    let data=await res.json();

    let filtered=data.filter(x=>x[4]=="approved");

    render(filtered);
}

// RENDER CARDS
function render(data){

    if(data.length===0){
        list.innerHTML="<p>No data</p>";
        return;
    }

    list.innerHTML=data.map(x=>`
    <div class="card">
        <h3>Patient ID: ${x[1]}</h3>
        <p><b>Time:</b> ${x[2]}</p>
        <p><b>Symptoms:</b> ${x[5]}</p>
        <p><b>Status:</b> ${x[4]}</p>

        ${x[4]=="pending" ? `
            <button class="approve" onclick="approve(${x[0]})">Approve</button>
            <button class="reject">Reject</button>
        ` : ``}
    </div>
    `).join("");
}

// APPROVE
async function approve(id){
    await fetch("/approve/"+id);
    loadPending();
}

// DEFAULT LOAD
loadPending();
</script>

</body>
</html>
