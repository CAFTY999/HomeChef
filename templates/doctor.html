<!DOCTYPE html>
<html>
<head>
<title>Doctor Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins, sans-serif;
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#1e293b;
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.menu{
    margin:10px 0;
    cursor:pointer;
    padding:10px;
    border-radius:8px;
    transition:0.2s;
}

.menu:hover{
    background:#334155;
}

.logout{
    margin-top:40px;
    display:block;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    background:#dc2626;
    text-align:center;
}

/* MAIN */
.main{
    flex:1;
    background:#f1f5f9;
    padding:30px;
    overflow:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.card h3{
    margin-top:0;
    color:#0f172a;
}

.card p{
    margin:8px 0;
    color:#334155;
}

a.btn{
    padding:8px 15px;
    border-radius:8px;
    text-decoration:none;
    display:inline-block;
    margin-right:8px;
    margin-top:10px;
    font-size:14px;
}

.approve{
    background:#22c55e;
    color:white;
}

.reject{
    background:#ef4444;
    color:white;
}

.consult{
    background:#2563eb;
    color:white;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    color:#64748b;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>Doctor</h2>

    <div class="menu" onclick="loadPending()">Requests</div>
    <div class="menu" onclick="loadApproved()">Upcoming</div>

    <a href="/logout" class="logout">Logout</a>

</div>

<!-- MAIN -->
<div class="main">

    <h2 id="title">Pending Requests</h2>

    <div id="list"></div>

</div>

<script>
const doctorData = JSON.parse('{{ appointments|tojson|safe }}');
// LOAD PENDING
function loadPending(){

    document.getElementById("title").innerText =
        "Pending Requests";

    let filtered = doctorData.filter(
        item => item[4] === "Pending"
    );

    render(filtered);
}

// LOAD APPROVED
function loadApproved(){

    document.getElementById("title").innerText =
        "Upcoming Appointments";

    let filtered = doctorData.filter(
        item => item[4] === "Approved"
    );

    render(filtered);
}

// RENDER DATA
function render(data){

    const list = document.getElementById("list");

    if(data.length === 0){
        list.innerHTML =
            `<div class="empty">No records found.</div>`;
        return;
    }

    list.innerHTML = data.map(item => `

        <div class="card">

            <h3>${item[1]}</h3>

            <p><b>Date:</b> ${item[2] || '-'}</p>
            <p><b>Time:</b> ${item[3] || '-'}</p>
            <p><b>Symptoms:</b> ${item[5] || '-'}</p>
            <p><b>Status:</b> ${item[4]}</p>

            ${
                item[4] === "Pending"
                ?
                `
                <a href="/approve/${item[0]}" class="btn approve">
                    Approve
                </a>

                <a href="/reject/${item[0]}" class="btn reject">
                    Reject
                </a>
                `
                :
                `
                <a href="/consult/${item[0]}" class="btn consult">
                    Open
                </a>
                `
            }

        </div>

    `).join("");
}

// DEFAULT LOAD
loadPending();
</script>

</body>
</html>
