<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Book Appointment</h2>

        <form method="POST">

            <!-- Symptoms -->
            <div class="mb-3">
                <label class="form-label">Symptoms</label>
                <input type="text"
                       name="symptoms"
                       class="form-control"
                       placeholder="Example: fever, headache"
                       required>
            </div>
            <div class="mb-3">
    <label class="form-label">Find Specialist</label>

    <div class="input-group">
        <input type="text"
               id="symptomSearch"
               class="form-control"
               placeholder="Enter symptom">

        <button type="button"
                class="btn btn-outline-primary"
                onclick="searchDoctor()">
            Suggest
        </button>
    </div>
</div>
{% if suggested %}
<div class="alert alert-success">
    Recommended Department:
    <strong>{{ suggested }}</strong>
</div>
{% endif %}
            <!-- Doctor -->
            <div class="mb-3">
                <label class="form-label">Select Doctor</label>

                <select name="doctor_id"
                        class="form-control"
                        required>

                    {% for d in doctors %}
                    <option value="{{ d[0] }}">
                        {{ d[1] }} ({{ d[2] }})
                    </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label class="form-label">Appointment Date</label>

                <input type="date"
                       name="date"
                       class="form-control"
                       required>
            </div>

            <!-- Time -->
            <div class="mb-3">
                <label class="form-label">Time Slot</label>

                <select name="time"
                        class="form-control"
                        required>

                    <option>09:00 AM</option>
                    <option>10:00 AM</option>
                    <option>11:00 AM</option>
                    <option>12:00 PM</option>
                    <option>02:00 PM</option>
                    <option>03:00 PM</option>
                    <option>04:00 PM</option>

                </select>
            </div>

            <button class="btn btn-primary w-100">
                Confirm Booking
            </button>

        </form>

        <a href="/patient" class="btn btn-secondary mt-3">
            Back
        </a>

    </div>

</div>
<script>
function searchDoctor(){
    let symptom =
        document.getElementById("symptomSearch").value;

    window.location =
        "/book?symptom=" + encodeURIComponent(symptom);
}
</script>
</body>

</html>
