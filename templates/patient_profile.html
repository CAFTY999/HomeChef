<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="mb-4">My Medical Profile</h3>

        <form method="POST">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Name</label>
                    <input name="name" value="{{ patient[0] }}" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Age</label>
                    <input name="age" value="{{ patient[1] }}" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Gender</label>
                    <input name="gender" value="{{ patient[2] }}" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input name="phone" value="{{ patient[3] }}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control">{{ patient[4] }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Blood Group</label>
                    <input name="blood" value="{{ patient[5] }}" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Allergies</label>
                    <input name="allergies" value="{{ patient[6] }}" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Chronic Conditions</label>
                    <input name="chronic" value="{{ patient[7] }}" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label>Emergency Contact</label>
                <input name="emergency" value="{{ patient[8] }}" class="form-control">
            </div>

            <button class="btn btn-success">
                Update Profile
            </button>

            <a href="/patient" class="btn btn-secondary ms-2">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
