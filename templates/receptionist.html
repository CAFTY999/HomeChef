<!DOCTYPE html>
<html>
<head>
<title>Receptionist Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins;
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#0f172a;
    color:white;
    padding:20px;
}

.menu{
    margin:10px 0;
    padding:10px;
    cursor:pointer;
    border-radius:8px;
}
.menu:hover{background:#1e293b;}

/* MAIN */
.main{
    flex:1;
    padding:30px;
    background:#f1f5f9;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}

/* INPUT */
input, select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

/* TIME */
.times{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.time{
    padding:10px;
    background:#e2e8f0;
    border-radius:10px;
    cursor:pointer;
}
.time.selected{background:#0f172a;color:white;}
.time.disabled{background:#ccc;pointer-events:none;}

button{
    padding:10px;
    background:#0f172a;
    color:white;
    border:none;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="sidebar">
<h2>Receptionist</h2>
<div class="menu" onclick="showBooking()">Book</div>
<div class="menu" onclick="showFilter()">View Appointments</div>
</div>

<div class="main">

<!-- BOOKING -->
<div id="booking" class="card">

<h3>Search Patient</h3>
<input id="searchPatient" placeholder="Enter name">

<div id="patients"></div>

<h3>Select Doctor</h3>
<select id="doctor"></select>

<h3>Select Date</h3>
<input type="date" id="date" onchange="loadSlots()">

<h3>Select Time</h3>
<div class="times" id="times"></div>

<button onclick="book()">Book Appointment</button>

</div>

<!-- FILTER -->
<div id="filter" class="card" style="display:none">

<h3>Filter Appointments</h3>

<input id="fdoc" placeholder="Doctor name">
<input type="date" id="fdate">

<button onclick="filter()">Search</button>

<div id="results"></div>

</div>

</div>

<script>

let selected_patient=null;
let selected_doctor=null;
let selected_time=null;

// -------- LOAD DOCTORS --------
async function loadDoctors(){
    let res=await fetch("/doctors");
    let data=await res.json();

    doctor.innerHTML=data.map(x=>`
        <option value=${x[0]}>${x[1]} (${x[2]})</option>
    `).join("");
}
loadDoctors();

// -------- SEARCH PATIENT --------
searchPatient.addEventListener("input", async function(){
    let res=await fetch("/search_patient/"+this.value);
    let data=await res.json();

    patients.innerHTML=data.map(x=>`
        <div onclick="selectPatient(${x[0]},'${x[1]}')">
            ${x[1]}
        </div>
    `).join("");
});

function selectPatient(id,name){
    selected_patient=id;
    patients.innerHTML="<b>"+name+"</b>";
}

// -------- LOAD SLOTS --------
async function loadSlots(){

    selected_doctor=doctor.value;
    let date=document.getElementById("date").value;

    let res=await fetch(`/available_slots/${selected_doctor}/${date}`);
    let data=await res.json();

    times.innerHTML="";

    data.forEach(t=>{
        let div=document.createElement("div");
        div.innerText=t.time;
        div.className="time";

        if(!t.available) div.classList.add("disabled");

        div.onclick=()=>{
            document.querySelectorAll(".time").forEach(x=>x.classList.remove("selected"));
            div.classList.add("selected");
            selected_time=t.time;
        };

        times.appendChild(div);
    });
}

// -------- BOOK --------
async function book(){

    let date=document.getElementById("date").value;

    let res=await fetch("/rec_book",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            patient_id:selected_patient,
            doctor_id:selected_doctor,
            date:date,
            time:selected_time
        })
    });

    let d=await res.json();
    alert(d.msg);
}

// -------- FILTER --------
async function filter(){
    let doc=document.getElementById("fdoc").value;
    let date=document.getElementById("fdate").value;

    let res=await fetch(`/filter_appts?doctor=${doc}&date=${date}`);
    let data=await res.json();

    results.innerHTML=data.map(x=>`
        <div class="card">
            ${x[1]} → ${x[2]} <br>
            ${x[3]} ${x[4]} <br>
            ${x[5]}
        </div>
    `).join("");
}

// -------- SWITCH --------
function showBooking(){
    booking.style.display="block";
    filter.style.display="none";
}

function showFilter(){
    booking.style.display="none";
    filter.style.display="block";
}

</script>

</body>
</html>
