<!DOCTYPE html>
<html>
<head>
<title>Medicine Bill</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<div class="container mt-5">

<div class="card shadow p-4">

    <h2 class="mb-4">Medicine Bill</h2>

    <table class="table table-bordered">

        <thead class="table-dark">
            <tr>
                <th>Medicine</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>

            {% for item in items %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>₹ {{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>₹ {{ item[1] * item[2] }}</td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

    <h4 class="text-end mb-4">
        Grand Total: ₹ {{ total }}
    </h4>

    <a href="/confirm_order/{{ prescription_id }}"
       class="btn btn-success">
       Confirm & Pay
    </a>

    <a href="/patient_prescriptions"
       class="btn btn-secondary">
       Back
    </a>

</div>

</div>

</body>
</html>
