<!DOCTYPE html>
<html>
<head>
    <title>Complete Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h3 class="mb-4">Complete Your Medical Profile</h3>

        <form method="POST">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Name</label>
                    <input name="name" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Age</label>
                    <input name="age" type="number" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Gender</label>
                    <select name="gender" class="form-control">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label>Phone</label>
                <input name="phone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control"></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Blood Group</label>
                    <input name="blood" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Allergies</label>
                    <input name="allergies" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Chronic Conditions</label>
                    <input name="chronic" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label>Emergency Contact</label>
                <input name="emergency" class="form-control">
            </div>

            <button class="btn btn-success">
                Save Profile
            </button>

        </form>

    </div>
</div>

</body>
</html>
