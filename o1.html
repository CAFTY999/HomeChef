<!DOCTYPE html>
<html>
<head>
<title>Patient Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Poppins;
    background:linear-gradient(135deg,#8EC5FC,#E0C3FC);
    padding:40px;
}

/* CARD */
.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* TITLE */
h2{
    margin-bottom:10px;
}

/* SEARCH */
.search-box{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    margin-bottom:20px;
}

/* SYMPTOMS */
.symptoms{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.sym{
    padding:10px 18px;
    background:#f1f5f9;
    border-radius:30px;
    cursor:pointer;
    transition:0.25s;
}

.sym:hover{
    transform:scale(1.05);
}

.selected{
    background:#6366f1;
    color:white;
}

/* BUTTON */
button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#6366f1;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* DROPDOWN */
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">
<div class="card">

<h2>Select Symptoms</h2>

<input id="search" class="search-box" placeholder="Search symptoms...">

<div class="symptoms" id="symptoms"></div>

<h3>Selected:</h3>
<p id="selected"></p>

<button onclick="findDoctor()">Find Specialist</button>

<h3 id="doctor"></h3>

<h3>Available Slots</h3>
<select id="slots"></select>

<button onclick="book()">Book Appointment</button>

</div>
</div>

<script>

// -------- DATA --------
let selected=[];
let doctor_id=null;

const symptomList=[
"fever","cold","headache","heart pain","chest pain",
"skin rash","itching","allergy","stomach pain",
"vomiting","dizziness","back pain","cough","fatigue"
];

// -------- LOAD SYMPTOMS --------
const container=document.getElementById("symptoms");

function renderSymptoms(list){
    container.innerHTML="";
    list.forEach(s=>{
        let div=document.createElement("div");
        div.innerText=s;
        div.className="sym";

        div.onclick=()=>{
            div.classList.toggle("selected");

            if(selected.includes(s)){
                selected=selected.filter(x=>x!==s);
            } else {
                selected.push(s);
            }

            document.getElementById("selected").innerText=selected.join(", ");
        };

        container.appendChild(div);
    });
}

renderSymptoms(symptomList);

// -------- SEARCH --------
document.getElementById("search").addEventListener("input",function(){
    let val=this.value.toLowerCase();
    let filtered=symptomList.filter(x=>x.includes(val));
    renderSymptoms(filtered);
});

// -------- FIND DOCTOR --------
async function findDoctor(){

    if(selected.length===0){
        alert("Select at least one symptom");
        return;
    }

    let res=await fetch("/get_doctor",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            symptoms:selected.join(",")
        })
    });

    let data=await res.json();

    if(data.msg){
        alert(data.msg);
        return;
    }

    doctor_id=data.doctor_id;

    document.getElementById("doctor").innerText=
        "Specialist: "+data.specialist+" | "+data.doctor_name;

    loadSlots();
}

// -------- LOAD SLOTS --------
async function loadSlots(){

    let res=await fetch("/slots/"+doctor_id);
    let data=await res.json();

    if(data.length===0){
        document.getElementById("slots").innerHTML="<option>No slots</option>";
        return;
    }

    document.getElementById("slots").innerHTML=
        data.map(x=>`<option value="${x.id}">${x.time}</option>`).join("");
}

// -------- BOOK --------
async function book(){

    const user_id = localStorage.getItem("user_id");

    if(!doctor_id){
        alert("Find doctor first");
        return;
    }

    await fetch("/book",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            patient_id: user_id,
            doctor_id: doctor_id,
            slot_id: document.getElementById("slots").value,
            symptoms: selected.join(",")
        })
    });

    alert("Appointment Requested ✅");
}

</script>

</body>
</html>
